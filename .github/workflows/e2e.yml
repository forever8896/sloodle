# Replays the end-to-end suite in e2e/ against the interface in demo mode.
#
# Needs no secrets and makes no model calls: every agent step replays from the
# recordings committed in e2e/.e2e/cache. --strict-cache fails a step whose
# recording no longer matches the app (REPLAY_STALE) instead of calling a model.
# A test with a goal that was never recorded fails here, because the runner has
# no Claude login: record it locally first (pnpm test:e2e) and commit the cache.
name: e2e

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      E2E_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 11
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            e2e/pnpm-lock.yaml

      - name: Install the app
        run: pnpm install --frozen-lockfile
      - name: Install the test suite
        run: pnpm --dir e2e install --frozen-lockfile

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('e2e/pnpm-lock.yaml') }}
      - name: Install Chromium
        run: pnpm --dir e2e exec e2e-web install chromium --with-deps

      - name: Replay the suite
        run: pnpm --dir e2e exec e2e run --strict-cache --reporter list,junit

      - name: Upload the report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-report
          path: |
            e2e/.e2e/report.json
            e2e/.e2e/junit.xml
            e2e/.e2e/results
          if-no-files-found: warn
          retention-days: 7
